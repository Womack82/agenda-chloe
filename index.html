<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mon agenda de devoirs</title>
<meta name="description" content="Organise tes devoirs, soir après soir">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Devoirs">
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="Agenda de devoirs">
<meta property="og:description" content="Organise tes devoirs, soir après soir">
<meta property="og:type" content="website">
<meta property="og:url" content="https://womack82.github.io/agenda-chloe/">
<meta property="og:image" content="https://womack82.github.io/agenda-chloe/img/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* Layout: one column phone app, bottom tab bar, sheets slide up from the bottom. */
:root{
  --paper:#f3f5f9; --card:#ffffff; --ink:#1b2333; --mute:#5a6472; --outline:#6e7977; --line:#e2e6ee; --chip:#e8eeff; --chip2:#f1f3ff; --gold:#ffb703;
  --accent:#0f766e; 
  --dev:#2f6fe4; --dev-soft:#e4edfd;
  --ctl:#e0533d; --ctl-soft:#fde9e5;
  --prj:#7c4ddb; --prj-soft:#efe8fc;
  --ok:#159a62; --warn:#c77a00; --warn-soft:#fff3d6; --bad:#d23b3b;
  --display:"Plus Jakarta Sans", "Avenir Next", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --shadow:0 1px 2px rgba(20,30,50,.06), 0 4px 14px rgba(20,30,50,.06);
  --accent-soft:color-mix(in srgb, var(--accent) 16%, var(--card));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151d; --card:#1a202b; --ink:#e8ecf3; --mute:#9aa5ba; --outline:#8792a6; --line:#2a3240; --chip:#232b38; --chip2:#1e2531;
    --accent:#3cc2b0; 
    --dev:#6b9cff; --dev-soft:#1c2a45; --ctl:#ff8068; --ctl-soft:#3d221d; --prj:#a98bff; --prj-soft:#2b2245;
    --ok:#3ccf8e; --warn:#f0b13d; --warn-soft:#3a2e14; --bad:#ff6b6b;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11151d; --card:#1a202b; --ink:#e8ecf3; --mute:#9aa5ba; --outline:#8792a6; --line:#2a3240; --chip:#232b38; --chip2:#1e2531;
  --accent:#3cc2b0; 
  --dev:#6b9cff; --dev-soft:#1c2a45; --ctl:#ff8068; --ctl-soft:#3d221d; --prj:#a98bff; --prj-soft:#2b2245;
  --ok:#3ccf8e; --warn:#f0b13d; --warn-soft:#3a2e14; --bad:#ff6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{max-width:560px;margin:0 auto;padding:18px 16px 110px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:700}
h2{font-size:20px;font-weight:700}
.sub{color:var(--mute);font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.empty{color:var(--mute);text-align:center;padding:18px 10px;font-size:15px}
.status{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);display:inline-block}
.dot.on{background:var(--ok)} .dot.warn{background:var(--warn)}

/* task rows */
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 12px 0;overflow:hidden;position:relative}
.row::before{content:"";align-self:stretch;width:5px;border-radius:0 4px 4px 0;background:var(--c,var(--accent))}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .title{font-weight:700;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px}
.row.done .title{text-decoration:line-through;color:var(--mute)}
.row.tap{cursor:pointer;border:0;text-align:left;width:100%}
.check{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--c,var(--accent));background:transparent;display:grid;place-items:center;font-weight:800;color:#fff}
.check.on{background:var(--c,var(--accent))}
.check svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--cs,var(--accent-soft));color:var(--c,var(--accent));white-space:nowrap}
.pill.late{background:var(--ctl-soft);color:var(--bad)}
.t-devoir{--c:var(--dev);--cs:var(--dev-soft)}
.t-controle{--c:var(--ctl);--cs:var(--ctl-soft)}
.t-projet{--c:var(--prj);--cs:var(--prj-soft)}
.prog{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.prog > i{display:block;height:100%;background:var(--c,var(--accent));border-radius:6px}

/* summary tile */
.tonight{background:var(--accent);color:#fff;border-radius:18px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
:root[data-theme="dark"] .tonight{color:#0b1715}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tonight{color:#0b1715}}
.tonight .big{font-family:var(--display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tonight .lbl{font-size:13px;opacity:.9}
.alert{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;border-left:4px solid var(--warn)}

/* days strip */
.days{display:flex;flex-direction:column;gap:8px}
.dayline{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:start;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.dayline .dname{font-weight:800;font-size:14px}
.dayline .dmin{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--cs,var(--line));color:var(--c,var(--ink));border:0;overflow-wrap:anywhere}
.chip.over{outline:2px solid var(--warn)}

/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center}
.cell .mo{display:block;font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;line-height:12px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--shadow);font-size:18px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font-size:11px;font-weight:800;color:var(--mute);text-align:center;text-transform:uppercase;padding:4px 0}
.cell{min-height:68px;border-radius:10px;background:var(--card);border:0;padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.cell.out{opacity:.35}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.sel{background:var(--accent);color:#fff}
.cell .minis{width:100%;display:flex;flex-direction:column;gap:2px}
.cell .dmi{font-size:10px}
.cell.sel .dmi{box-shadow:0 0 0 1.5px #fff}
.cell{border-radius:12px}
.cell .n{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.cell .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.cell .dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.cell.sel .dots i{box-shadow:0 0 0 1.5px #fff}
.cell .load{width:70%;height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:auto}
.cell .load i{display:block;height:100%;background:var(--ok)}
.cell .load i.full{background:var(--warn)} .cell .load i.over{background:var(--bad)}
.cell{position:relative}.cell .evm{position:absolute;top:4px;right:4px;width:0;height:0;border-left:8px solid transparent;border-top:8px solid var(--warn)}
.cell.blocked{background:repeating-linear-gradient(135deg,var(--card) 0 6px,var(--paper) 6px 9px)}.cell.sel.blocked{background:var(--accent)}
.evrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.evrow:last-child{border-bottom:0}.evrow .main{flex:1;min-width:0}.evrow b{overflow-wrap:anywhere}
.evrow .x{border:0;background:var(--paper);width:32px;height:32px;border-radius:10px;font-weight:800;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}


.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.two{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:8px 4px;margin:0 -6px;display:flex;flex-direction:column;gap:8px}
.two .grid{gap:3px}
.hcell{position:relative;min-height:88px;border-radius:10px;border:0;background:var(--paper);padding:5px 3px;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0;text-align:left;padding:4px 2px}
.hcell .n{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;padding-left:2px;white-space:nowrap}
.hcell.past{opacity:.5}
.hcell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.hcell.today .n{color:var(--accent)}
.hcell.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.hcell.blocked{background:repeating-linear-gradient(135deg,var(--paper) 0 6px,var(--card) 6px 9px)}
.hcell.blocked.sel{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 6px,var(--card) 6px 9px)}
.minis{display:flex;flex-direction:column;gap:3px}
.mini{display:block;font-size:10.5px;letter-spacing:-.01em;font-weight:800;line-height:1.15;padding:3px 2px;border-radius:5px;background:var(--cs);color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini.due{background:var(--c);color:#fff}
.hcell .mini{background:var(--c);color:#fff;font-size:10.5px;padding:4px 1px;letter-spacing:-.03em;text-overflow:clip}
.hcell .mini.fin{background:var(--cs);color:var(--c)}
.mini.fin{text-decoration:line-through;opacity:.55}
.more{font-size:11px;font-weight:800;color:var(--mute);padding-left:3px}
.evtag{font-size:10px;font-weight:800;color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.legend .solid{background:var(--dev);color:#fff;border-radius:4px;padding:0 4px;font-size:11px}

.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#ffb703));color:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero h1{color:#fff;font-size:27px}
.hero .daterow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.hero .flame{position:relative;z-index:1;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 11px;font-size:13px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.hero .flame b{font-family:var(--display);font-size:18px}
.hero .flame span{opacity:.9}
.hero .sub{color:rgba(255,255,255,.88)}
.hero .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hero .st{background:rgba(255,255,255,.18);border-radius:14px;padding:8px 10px}
.hero .st b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .st span{font-size:12px;opacity:.92}
.hero .status{color:rgba(255,255,255,.85)}
.hero .status .dot.on{background:#fff}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;background:var(--s)}
.sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--card)}
.check{transition:transform .15s}
.check:active{transform:scale(.85)}
.ring{position:relative;width:220px;height:220px;margin:4px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rt b{font-family:var(--display);font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.ring .rt span{color:var(--mute);font-weight:700}
@media (prefers-reduced-motion: reduce){.ring .fg{transition:none}}
.steplbl{font-weight:800;color:var(--c,var(--accent));font-size:14px;overflow-wrap:anywhere}
.steps{display:flex;flex-direction:column;gap:8px}
.stepr{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--paper);border-radius:12px;padding:8px}
.stepr .num{width:26px;height:26px;border-radius:50%;background:var(--cs,var(--accent-soft));color:var(--c,var(--accent));display:grid;place-items:center;font-weight:800;font-size:13px}
.stepr .num.ok{background:var(--ok);color:#fff}
.stepr input{padding:8px 10px;font-size:15px;background:var(--card)}
.stepr .ctl{display:flex;align-items:center;gap:4px}
.stepr .ctl button{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:15px;padding:0}
.stepr .ctl b{min-width:44px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.stepr .tools{grid-column:2/4;display:flex;justify-content:flex-end;gap:4px}
.stepr .tools button{border:0;background:none;color:var(--mute);font-weight:800;font-size:13px;padding:2px 6px}
.t-pause{--c:var(--accent)}
.pausebtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:11px 14px;font-weight:800;font-size:15px;text-align:left}
.pausebtn span{font-size:12px;font-weight:700;color:var(--mute)}
.brk{display:flex;align-items:center;gap:10px;margin:-2px 0}
.brk::before,.brk::after{content:"";flex:1;border-top:2px dotted var(--line)}
.brk button{border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.brk button span{font-weight:700;color:var(--mute);font-size:12px}
.hm{display:flex;align-items:center;gap:8px}
.hm input{width:76px;text-align:center;font-size:20px;font-weight:800;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 6px;font-variant-numeric:tabular-nums}
.hm span{font-weight:800;color:var(--ink);font-size:16px}
.szi{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.szi .pg{fill:var(--card)}
.opt.on .szi .pg{fill:var(--cs,var(--accent-soft))}
.cchip{display:flex;align-items:center;justify-content:center;height:22px;border-radius:7px;color:#fff;font-size:11px;font-weight:800}
.cchip img{width:15px;height:15px}
.cchip.fin{opacity:.35}
.grid.g5{grid-template-columns:repeat(5,1fr);gap:6px}
.g5 .dcell{min-height:80px}
.g5 .cchip{height:24px}.g5 .cchip img{width:16px;height:16px}
.cchip.lg{background:var(--outline);width:22px;height:20px;display:inline-flex}.cchip.lg img{width:13px;height:13px}
.dcell.sel .cchip{box-shadow:0 0 0 1.5px #fff}
.cell .cchip{height:18px}.cell .cchip img{width:13px;height:13px}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:var(--mute)}
input[type=text],input[type=date],textarea{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 12px;font-size:16px}
textarea{min-height:64px;resize:vertical}
.seg{display:grid;gap:6px}
.seg.c3{grid-template-columns:repeat(3,1fr)} .seg.c4{grid-template-columns:repeat(4,1fr)}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.opt small{font-weight:600;color:var(--mute);font-size:12px}
.opt.on{border-color:var(--c,var(--accent));background:var(--cs,var(--accent-soft));color:var(--c,var(--accent))}
.opt.on small{color:inherit}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:20px;font-weight:800}
.stepper b{min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:16px;background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn{color:#0b1715}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0b1715}}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.full{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.hint{font-size:14px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.hint.warn{background:var(--warn-soft)}

/* nav */
nav{position:fixed;left:16px;right:16px;bottom:max(22px, env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:6px 8px;z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--mute);padding:6px 0}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}
nav .add{width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;margin:-22px auto 0;box-shadow:0 6px 16px rgba(15,118,110,.35);justify-content:center}
nav .add svg{width:28px;height:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheetbox{position:relative;width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column}
.sheetclose{position:absolute;top:-22px;right:16px;z-index:2;width:44px;height:44px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:18px;font-weight:800;color:var(--ink)}
.sheet{background:var(--card);width:100%;max-width:560px;flex:1 1 auto;min-height:0;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:-6px auto 0}
.sethead{display:flex;justify-content:space-between;align-items:center;gap:10px}

let dbRef=null,saving=false,pending=false,saveTimer=null,sync='local';
function commit(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(dbRef){clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}}
async function flush(){if(!dbRef)return;if(saving){pending=true;return}saving=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(S)));sync='cloud';lastSaved=S.updatedAt}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='permission-denied')){sync='readonly';dbRef=null}else if(e&&e.code==='quota_exceeded'){sync='full'}else sync='error'}
  saving=false;renderStatus();if(pending){pending=false;flush()}}
// Les données vivent dans la base de l'artifact (doc « agenda/principal ») : elles survivent à chaque mise à jour de l'app.
let lastSaved=0;
async function initDb(){
  for(let k=0;k<30&&!(window.claude&&window.claude.use);k++)await new Promise(r=>setTimeout(r,100));
  if(!(window.claude&&window.claude.use))return;
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db)return;
    const ref=db.doc('agenda/principal');
    const t=setTimeout(()=>{sync='slow';renderStatus()},10000);
    let snap;try{snap=await ref.get()}finally{clearTimeout(t)}
    let remote=snap.exists?snap.data():null;
    // ancienne version : données dans l'espace privé de l'utilisateur → on les récupère une fois
    if(!remote&&user){try{const id=await user.id();if(id){const old=await db.doc('data/users/'+id+'/agenda').get();if(old.exists)remote=old.data()}}catch(e){}}
    dbRef=ref;sync='cloud';
    if(remote&&remote.items&&(remote.updatedAt||0)>=(S.updatedAt||0)){
      S=normalize(JSON.parse(JSON.stringify(remote)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
      lastSaved=S.updatedAt||0;render();
      if(!snap.exists)flush();
    }else if(S.items.length||S.updatedAt){flush()}
    // mises à jour venant d'un autre appareil (téléphone ↔ ordinateur)
    ref.onSnapshot(sn=>{if(!sn.exists||saving||sn.metadata.hasPendingWrites)return;const d=sn.data();
      if(d&&d.items&&(d.updatedAt||0)>(S.updatedAt||0)){S=normalize(JSON.parse(JSON.stringify(d)));lastSaved=S.updatedAt;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(!ui.sheet)render();else renderStatus()}},()=>{});
    renderStatus();
  }catch(e){sync='local';renderStatus()}
}

async function connectFirestore(){
  const doc=firebase.firestore().collection('agendas').doc(AGENDA_ID);

  try{
    const snap=await doc.get();clearTimeout(t);

    else if(S.items.length||S.updatedAt){flush()}
    doc.onSnapshot(sn=>{if(!sn.exists||saving||sn.metadata.hasPendingWrites)return;let d=null;try{d=JSON.parse(sn.data().data)}catch(e){return}
      if(d&&d.items&&(d.updatedAt||0)>(S.updatedAt||0)){S=normalize(d);lastSaved=S.updatedAt;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}if(!ui.sheet)render();else renderStatus()}},()=>{});
    renderStatus();

}

/* ---------- planner ---------- */
function eventsOn(d){const w=parse(d).getDay();return S.events.filter(e=>e.kind==='weekly'?(e.weekday===w&&(!e.from||d>=e.from)):e.date===d)}
function minutesFor(d){const base=S.settings.cap[parse(d).getDay()];const ev=eventsOn(d);if(!ev.length)return base;return Math.min(base,...ev.map(e=>e.free))}
function blockMin(){return Math.round(S.settings.sessionMin*(S.settings.pace||1)/5)*5}
function slotsFor(d){return Math.floor(minutesFor(d)/blockMin())}
function doneOn(it,d){return (it.log||[]).filter(x=>x===d).length}
function hasSteps(i){return Array.isArray(i.steps)&&i.steps.length>0}
function syncSteps(i){if(!hasSteps(i))return;i.steps.forEach(st=>{st.sessions=Math.max(1,st.sessions|0);st.done=Math.max(0,Math.min(st.done|0,st.sessions))});
  i.sessions=i.steps.reduce((a,x)=>a+x.sessions,0);i.done=i.steps.reduce((a,x)=>a+x.done,0)}
function ent(e){const k=e.indexOf(':');const id=k<0?e:e.slice(0,k),sid=k<0?null:e.slice(k+1);const it=itemById(id);const st=sid&&it&&hasSteps(it)?it.steps.find(x=>x.id===sid):null;return{id,sid,it,st}}
function stopFor(d){const x=(S.settings.stop||{})[String(parse(d).getDay())];return x&&x.at?x:null}
function minutesLeftToday(){const x=stopFor(today());if(!x)return null;const [hh,mm]=x.at.split(':').map(Number);const n=new Date();return Math.max(0,hh*60+mm-(n.getHours()*60+n.getMinutes()))}
function computePlan(){
  const t=today(),plan={},load={},cap={};
  const active=S.items.filter(i=>!i.completed);
  let end=addDays(t,41);active.forEach(i=>{if(i.due>end)end=i.due});
  for(let d=t;d<=end;d=addDays(d,1)){plan[d]=[];load[d]=0;cap[d]=slotsFor(d)}
  S.items.forEach(i=>{load[t]+=doneOn(i,t)});
  const ml=minutesLeftToday();if(ml!=null)cap[t]=Math.min(cap[t],load[t]+Math.floor(ml/blockMin()));
  const prio={controle:0,projet:1,devoir:2};
  const order=active.slice().sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:prio[a.type]-prio[b.type]);
  for(const it of order){
    let last=addDays(it.due,-1);if(last<t)last=t;
    const all=[];for(let d=t;d<=last;d=addDays(d,1))all.push(d);
    const dt=doneOn(it,t),rev=it.type==='controle';
    // une « unité » = une étape (ou le travail entier s'il n'est pas découpé)
    let units=hasSteps(it)?it.steps.map(st=>({key:it.id+':'+st.id,rem:Math.max(0,st.sessions-st.done)})):[{key:it.id,rem:Math.max(0,it.sessions-it.done)}];
    if(rev)units=units.slice().reverse();
    let bound=rev?last:t; // les étapes restent dans l'ordre
    for(const u of units){
      if(!u.rem)continue;
      let cand=all.filter(d=>rev?d<=bound:d>=bound);if(!cand.length)cand=[bound];
      if(ml===0&&cand.length>1)cand=cand.filter(d=>d!==t); // heure limite passée : plus rien ce soir
      const n=all.length;let edge=null;
      for(let k=0;k<u.rem;k++){
        let best=cand[0],bs=Infinity;
        cand.forEach(d=>{
          const j=all.indexOf(d)<0?0:all.indexOf(d);
          const c=cap[d],l=load[d];
          const same=plan[d].filter(p=>p===it.id||p.startsWith(it.id+':')).length+(d===t?dt:0);
          let s=0;
          if(l>=c)s+=1000+(l-c+1)*100;          // pas de place ce soir-là
          s+=same*60;                            // évite 2 séances du même travail le même soir
          s+=c>0?(l/c)*8:0;                      // équilibre la charge
          if(it.type==='controle')s+=(n-1-j)*1.5; // révisions dans les jours avant le contrôle
          else if(it.type==='devoir')s+=j*1.5;    // devoir : le plus tôt possible
          else s+=j*0.4;                          // projet : réparti
          if(s<bs){bs=s;best=d}
        });
        plan[best].push(u.key);load[best]++;
        if(edge===null||(rev?best<edge:best>edge))edge=best;
      }
      if(edge!==null)bound=edge;
    }
  }
  Object.keys(plan).forEach(d=>plan[d].sort((a,b)=>{const A=ent(a),B=ent(b);if(A.id!==B.id)return 0;return (A.it.steps||[]).indexOf(A.st)-(B.it.steps||[]).indexOf(B.st)}));
  return{plan,load,cap};
}
function itemById(id){return S.items.find(i=>i.id===id)}
function sessionIndexMap(P){ // numéro de la séance (dans l'étape ou le travail) pour chaque séance planifiée
  const idx={},count={};
  Object.keys(P.plan).sort().forEach(d=>{idx[d]=P.plan[d].map(e=>{const x=ent(e);count[e]=(count[e]||0)+1;return (x.st?x.st.done:x.it.done)+count[e]})});
  return idx;
}
function freeSlotsBefore(due,P){let f=0;const t=today();let last=addDays(due,-1);if(last<t)last=t;
  for(let d=t;d<=last;d=addDays(d,1)){f+=Math.max(0,(P.cap[d]??slotsFor(d))-(P.load[d]||0))}return f}

function streak(){const t=today();const worked=new Set();S.items.forEach(i=>(i.log||[]).forEach(d=>worked.add(d)));
  let d=worked.has(t)?t:addDays(t,-1),n=0;
  for(let k=0;k<400;k++){if(worked.has(d)){n++}else if(slotsFor(d)>0)break;d=addDays(d,-1)}return n}

function confetti(big){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(e){}
  const c=document.getElementById('confetti'),x=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#ffb703','#fb5607','#ff006e','#8338ec','#3a86ff','#06d6a0'];
  const ps=Array.from({length:big?140:60},()=>({x:W/2+(Math.random()-.5)*80,y:H*.55,vx:(Math.random()-.5)*(big?14:10),vy:-Math.random()*(big?16:12)-4,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function tick(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<(big?110:75))requestAnimationFrame(tick);else x.clearRect(0,0,W,H)})();
}

  if(/hist/.test(x))return'histoire';if(/citoy|ccq|culture/.test(x))return'ccq';if(/^art/.test(x))return'arts';return null}
const SUBJ_EMOJI={'Éduc. physique':'🏃','Espagnol':'💬','Musique':'🎵','Géographie':'🗺️'};

function viewToday(){
  const t=today(),P=computePlan(),idx=sessionIndexMap(P),sm=blockMin();

  const todayLeft=(P.plan[t]||[]).length;const stk=streak();const mon0=addDays(t,-((parse(t).getDay()+6)%7));let weekDone=0;S.items.forEach(i=>(i.log||[]).forEach(x=>{if(x>=mon0&&x<=t)weekDone++}));const nextDue=S.items.filter(i=>!i.completed&&i.due>=t).sort((a,b)=>a.due<b.due?-1:1)[0];const nm=S.settings.name?' '+h(S.settings.name):'';

   <div class="spills"><span class="streak" title="Jours de suite avec au moins une séance faite">${MS('local_fire_department','fill')}${stk} jour${stk>1?'s':''} de suite</span>${nextDue?`<span class="sp ${exam||diff(t,nextDue.due)<=1?'exam':''}">${MS('priority_high')}Remise : ${h(dueLabel(nextDue.due))}</span>`:''}</div>
   </section>`;
  if(late.length)html+=`<div class="alert" style="border-left-color:var(--bad);background:var(--ctl-soft)"><b>En retard :</b> ${late.map(i=>h(i.title)).join(', ')}. Si c'est déjà remis, marque-le terminé dans « Mes travaux ».</div>`;
  if(over.length)html+=`<div class="alert"><b>Trop de travail ${over.length===1?'le '+h(longDate(over[0])):'certains soirs'}.</b> Avance un peu aujourd'hui si tu peux.</div>`;

  const endD=addDays(monday,11);const m1=parse(monday),m2=parse(endD);
  const mlabel=m1.getMonth()===m2.getMonth()?MOIS[m1.getMonth()]+' '+m1.getFullYear():MOIS[m1.getMonth()]+' – '+MOIS[m2.getMonth()]+' '+m2.getFullYear();
  html+=`<section class="cal2"><div class="c2head"><span class="m">${MS('calendar_today')}${h(mlabel.replace(/^./,c=>c.toUpperCase()))}</span><span class="eyebrow" style="font-size:11px">Vue 2 semaines</span></div>`;

    for(let k=w*7;k<w*7+5;k++){

        <span class="wdn">${WD[k%7]}</span><span class="dn">${dd.getDate()}</span>${evs.length?`<span class="evtag">${h(evs[0].label)}</span>`:''}<span class="minis">${chips}</span></button>`;

  const dues=S.items.filter(i=>i.due===d&&!i.completed);
  html+=`<div class="section"><div class="section-head"><h2>${h(title)}${planned.length?`<span class="cnt">${planned.length} séance${planned.length>1?'s':''}</span>`:''}</h2><span class="sub">${planned.length?'~ '+fmtMin(planned.length*sm)+' au total':''}</span></div>`;
  eventsOn(d).forEach(e=>html+=`<div class="hint">${h(e.label)} : ${freeLabel(e.free)}.</div>`);
  {const x=stopFor(d);if(x){const ml=d===t?minutesLeftToday():null;html+=`<div class="hint">${h(x.why||'Fin des devoirs')} : pas de devoirs après ${h(x.at.replace(':00',' h').replace(':',' h '))}${ml===0?'. C\'est fini pour aujourd\'hui, le reste est déplacé aux jours suivants.':'.'}</div>`}}

  const rows=[];

  return html;

function listRow(i){
  const pct=Math.round(Math.min(1,i.done/i.sessions)*100);
  const n=diff(today(),i.due),late=!i.completed&&n<0;
  const dl=i.completed?'Terminé':late?'En retard':n===0?"Aujourd'hui":n===1?'Demain':(JOURS[parse(i.due).getDay()].replace(/^./,c=>c.toUpperCase())+' '+parse(i.due).getDate());
  const stepTxt=hasSteps(i)?' • '+i.steps.filter(z=>z.done>=z.sessions).length+'/'+i.steps.length+' étapes':'';
  return `<button class="ant ${typeCls(i.type)} ${i.completed?'done':''}" onclick="openEdit('${i.id}')">
    <span class="aic">${subjIcon(i.subject)}</span>
    <span class="atx"><b>${h(i.title)}</b><span>${h(i.subject||'Sans matière')} • ${TYPES[i.type].label}${stepTxt}</span>${i.completed?'':`<span class="prog"><i style="width:${pct}%"></i></span>`}</span>
    <span class="adt"><b class="${late?'late':i.type==='controle'?'exam':''}">${h(dl)}</b><span>${i.done}/${i.sessions} séances</span></span></button>`;
}

function freeLabel(m){return m===0?'pas de temps pour les devoirs':fmtMin(m)+' pour les devoirs'}

function openEvent(d,weekly){const date=d||today();ui.ev={label:'',date,weekly:!!weekly,weekday:parse(date).getDay(),fh:0,fm:0};ui.sheet={kind:'event'};renderSheet()}

  <div class="chips">${sugg.map(x=>`<button class="opt ${e.label===x?'on':''}" style="padding:6px 11px" onclick="setE('label',${h(JSON.stringify(x))})">${x}</button>`).join('')}</div>
  <div class="seg c3" style="grid-template-columns:1fr 1fr"><button class="opt ${!e.weekly?'on':''}" onclick="setE('weekly',false)">Une fois</button><button class="opt ${e.weekly?'on':''}" onclick="setE('weekly',true)">Chaque semaine</button></div>
  ${e.weekly?`<div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:800;color:var(--mute)">Quel jour ?<div class="chips">${[1,2,3,4,5,6,0].map(w=>`<button class="opt ${e.weekday===w?'on':''}" style="padding:7px 11px" onclick="setE('weekday',${w})">${JOURS[w]}</button>`).join('')}</div></div>`

   <div class="hm"><input type="number" id="eH" inputmode="numeric" min="0" max="10" value="${e.fh}" aria-label="Heures"><span>h</span><input type="number" id="eM" inputmode="numeric" min="0" max="59" step="5" value="${e.fm}" aria-label="Minutes"><span>min</span></div>
   <span class="sub" style="font-weight:600">Mets 0 h 0 min si tu n'as pas de temps pour les devoirs ce jour-là.</span></div>

function readHM(){const H=document.getElementById('eH'),M=document.getElementById('eM');if(H)ui.ev.fh=Math.max(0,Math.min(10,parseInt(H.value,10)||0));if(M)ui.ev.fm=Math.max(0,Math.min(59,parseInt(M.value,10)||0))}
function setE(k,v){readHM();const t=document.getElementById('eLabel');if(t)ui.ev.label=t.value;ui.ev[k]=v;renderSheet()}
function saveEvent(){readHM();const t=document.getElementById('eLabel');if(t)ui.ev.label=t.value;const e=ui.ev;e.free=Math.min(600,e.fh*60+e.fm);
  if(!e.label.trim()){t.style.borderColor='var(--bad)';t.placeholder='Écris un nom';t.focus();return}

  S.events.push(ev);const tt=addDays(today(),-60);S.events=S.events.filter(x=>x.kind==='weekly'||x.date>=tt);

function delEvent(id){S.events=S.events.filter(e=>e.id!==id);commit();render()}

/* ---------- minuteur de pause ---------- */
let pauseTick=null;
function openPause(sug){const m=Math.min(20,Math.max(1,sug||10));ui.pause={min:m,total:m*60,left:m*60,end:null,running:false,started:false};ui.sheet={kind:'pause'};renderSheet()}
function pauseLeft(){const f=ui.pause;return f.running?Math.max(0,Math.round((f.end-Date.now())/1000)):f.left}
function pauseSet(m){m=Math.max(1,Math.min(20,m));ui.pause.min=m;ui.pause.total=ui.pause.left=m*60;renderSheet()}
function pauseStart(){const f=ui.pause;f.started=true;f.end=Date.now()+f.left*1000;f.running=true;clearInterval(pauseTick);pauseTick=setInterval(pauseUpdate,500);renderSheet()}
function pauseHold(){const f=ui.pause;f.left=pauseLeft();f.running=false;clearInterval(pauseTick);renderSheet()}
function pauseStop(){clearInterval(pauseTick);ui.pause=null;closeSheet()}
function mmss(x){return Math.floor(x/60)+':'+pad(x%60)}
function pauseUpdate(){if(!ui.pause)return clearInterval(pauseTick);const l=pauseLeft();const e=document.getElementById('pTime');if(e)e.textContent=mmss(l);
  const r=document.getElementById('pRing');if(r)r.style.strokeDashoffset=String(565.5*(1-l/ui.pause.total));
  if(l<=0){clearInterval(pauseTick);ui.pause.left=0;ui.pause.running=false;renderSheet();confetti(false)}}
function pauseHtml(){const f=ui.pause;const l=pauseLeft();const over=f.started&&l<=0;
  const ideas=['Bouge un peu : étire-toi ou fais quelques sauts','Bois un verre d\'eau 💧','Prends une collation 🍎','Regarde dehors, repose tes yeux','Mets ta chanson préférée 🎵'];
  const idea=ideas[new Date().getMinutes()%ideas.length];
  let html=`<div class="sethead"><h2>☕ Pause</h2><button class="iconbtn" onclick="pauseStop()" aria-label="Fermer la pause">✕</button></div>`;
  if(!f.started){
    html+=`<div class="sub">Durée suggérée selon le travail fait. Tu peux la changer (20 min maximum).</div>
    <div class="seg c4">${[5,10,15,20].map(v=>`<button class="opt ${f.min===v?'on':''}" onclick="pauseSet(${v})">${v} min</button>`).join('')}</div>
    <div class="stepper" style="justify-content:center"><button onclick="pauseSet(${f.min-1})" aria-label="Une minute de moins">−</button><b>${f.min} min</b><button onclick="pauseSet(${f.min+1})" aria-label="Une minute de plus" ${f.min>=20?'disabled':''}>+</button></div>`;
  }
  html+=`<div class="ring t-pause"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" class="bg"/><circle id="pRing" cx="100" cy="100" r="90" class="fg" style="stroke-dasharray:565.5;stroke-dashoffset:${565.5*(1-l/f.total)}"/></svg>
   <div class="rt"><b id="pTime">${mmss(l)}</b><span>${over?'Pause terminée !':f.running?'Profite de ta pause':f.started?'En attente':'Prête ?'}</span></div></div>`;
  if(over)html+=`<div class="hint" style="text-align:center"><b>C'est reparti !</b> Ta prochaine tâche t'attend.</div><button class="btn full" onclick="pauseStop()">Retour à mes devoirs</button>`;
  else html+=`<div class="btnrow">${f.running?`<button class="btn ghost" onclick="pauseHold()">Arrêter le temps</button>`:`<button class="btn" onclick="pauseStart()">${f.started?'Reprendre':'Lancer la pause'}</button>`}${f.started?`<button class="btn ghost" onclick="pauseStop()">Finir la pause</button>`:''}</div>`;
  html+=`<div class="sub" style="text-align:center">💡 ${idea}</div>`;
  return html}

/* ---------- sheets ---------- */
function renderSheet(){
  const root=document.getElementById('sheetRoot');
  if(!ui.sheet){root.innerHTML='';return}
  let inner='';
  if(ui.sheet.kind==='form')inner=formHtml();
  else if(ui.sheet.kind==='after')inner=afterHtml();
  else if(ui.sheet.kind==='event')inner=evHtml();
  else if(ui.sheet.kind==='pause')inner=pauseHtml();
  const closeBtn=ui.sheet.kind==='pause'?'':`<button class="sheetclose" onclick="closeSheet()" aria-label="Fermer">✕</button>`;
  const oldSheet=root.querySelector('.sheet');const keepScroll=oldSheet?oldSheet.scrollTop:0;
  root.innerHTML=`<div class="scrim" onclick="if(event.target===this&&!(ui.pause&&ui.pause.running))${'closeSheet()'}"><div class="sheetbox"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div>${closeBtn}</div></div>`;
  const newSheet=root.querySelector('.sheet');if(newSheet)newSheet.scrollTop=keepScroll;
}
function closeSheet(){if(ui.pause){clearInterval(pauseTick);ui.pause=null}ui.sheet=null;ui.form=null;ui.ev=null;render()}

function formHtml(){

  const tsub={devoir:'Exercices, lecture…',controle:'Révisions avant',projet:'Plusieurs étapes'};
  const t0=today(),qd=[[addDays(t0,1),'Demain']];{let x=addDays(t0,1);while(parse(x).getDay()!==5)x=addDays(x,1);if(x!==qd[0][0])qd.push([x,'Ce vendredi']);let y=addDays(t0,1);while(parse(y).getDay()!==1)y=addDays(y,1);qd.push([y,'Lundi proch.'])}
  let html=`<div class="sethead"><div><span class="eyebrow" style="color:var(--accent)">${editing?'Modifier':'Nouveau travail'}</span><h2 style="margin-top:2px">${editing?'Modifier ce travail':'Ajouter un devoir ou contrôle'}</h2></div></div>

  <div class="fgroup"><label class="flabel" for="fTitle">Intitulé de la tâche</label><div class="inbox"><span class="ib">${MS('edit')}</span><input type="text" id="fTitle" value="${h(f.title)}" placeholder="${f.type==='controle'?'ex. Contrôle chapitre 4, fonctions':f.type==='projet'?'ex. Exposé sur la Nouvelle-France':'ex. Exercices p. 112, nos 1 à 8'}" oninput="ui.form.title=this.value"></div></div>

   <div class="datebar"><span class="l"><span class="ib">${MS('calendar_month')}</span>Choisir une date précise</span><input type="date" id="fDue" value="${f.due}" onchange="setF('due',this.value)" aria-label="Date"></div></div>

   <div class="seg c4">${SIZES.map((s,k)=>`<button class="opt ${!f.custom&&f.size===k?'on':''}" onclick="setSize(${k})">${SIZE_ICONS[k]}${s}<small>${fmtMin(T.sizes[k]*sm)}</small></button>`).join('')}
   <button class="opt ${f.custom?'on':''}" onclick="setSize(-1)"><svg class="szi" viewBox="0 0 32 32" aria-hidden="true"><rect x="9" y="4" width="14" height="22" rx="2" class="pg" stroke-dasharray="3 2.5"/><path d="M16 11v8M12 15h8"/></svg>Autre<small>à choisir</small></button></div></div>`}`;
  if(f.custom&&!f.steps.length)html+=`<div class="stepper"><button onclick="bump(-1)" aria-label="Une séance de moins">−</button><b>${f.sessions} séance${f.sessions>1?'s':''}</b><button onclick="bump(1)" aria-label="Une séance de plus">+</button><span class="sub">≈ ${fmtMin(f.sessions*sm)}</span></div>`;
  // hints
  const r=f.subject?ratioFor(f.subject):null;
  if(r&&Math.abs(r-1)>=0.2)html+=`<div class="hint">En ${h(f.subject)}, tes travaux ont pris en moyenne <b>${r>1?'plus':'moins'} de temps</b> que prévu (×${r.toFixed(1).replace('.',',')}). ${r>1?'Choisis peut-être une taille de plus.':'Une taille de moins suffira peut-être.'}</div>`;
  const fSess=f.steps.length?f.steps.reduce((a,x)=>a+x.sessions,0):f.sessions,fDone=f.steps.length?f.steps.reduce((a,x)=>a+x.done,0):(it?it.done:0);
  if(f.due){const P=computePlanExcluding(f.id);const free=freeSlotsBefore(f.due,P);const need=Math.max(0,fSess-fDone);
    if(need>free)html+=`<div class="hint warn">D'ici là, il reste environ ${fmtMin(free*sm)} de libre et ce travail demande ${fmtMin(need*sm)}. Certains soirs vont déborder : commence dès que possible ou ajoute du temps dans le calendrier.</div>`;
    else if(f.type==='controle'&&!f.steps.length)html+=`<div class="hint">Les ${need} révisions seront placées dans les soirs avant le contrôle.</div>`;}

  return html;
}
const STEP_IDEAS={devoir:['Exercices','Lire le texte','Répondre aux questions','Vérifier mes réponses'],controle:['Relire mes notes','Faire ma fiche','Exercices de pratique','Me faire questionner'],projet:['Recherche','Faire le plan','Rédiger ma partie','Préparer la présentation']};
function stepsHtml(){const f=ui.form,sm=blockMin();
  let html=`<div class="card stack ${typeCls(f.type)}" style="box-shadow:none;border:1.5px solid var(--line)"><div><b>Découper en étapes</b> <span class="sub">(facultatif)</span><div class="sub">Ex. « 3 pages d'exercices » et « lire le texte » : chaque étape sera placée sur un soir différent, dans l'ordre.</div></div>`;
  if(f.steps.length){html+=`<div class="steps">`;f.steps.forEach((st,k)=>{const ok=st.done>=st.sessions;
    html+=`<div class="stepr">${ok?`<button class="num ok" style="border:0;padding:0;font:inherit" onclick="stepUndo(${k})" aria-label="Remettre cette étape à faire">✓</button>`:`<span class="num">${k+1}</span>`}<input type="text" id="st_${k}" value="${h(st.label)}" placeholder="Étape ${k+1}" oninput="ui.form.steps[${k}].label=this.value" aria-label="Nom de l'étape ${k+1}">
      <span class="ctl"><button onclick="stepBump(${k},-1)" aria-label="Moins de temps">−</button><b>${fmtMin(st.sessions*sm)}</b><button onclick="stepBump(${k},1)" aria-label="Plus de temps">+</button></span>
      <span class="tools">${k>0?`<button onclick="stepMove(${k},-1)">↑ Monter</button>`:''}${k<f.steps.length-1?`<button onclick="stepMove(${k},1)">↓ Descendre</button>`:''}<button onclick="stepDel(${k})">✕ Retirer</button></span></div>`});

  return html}
function syncSteps_(){(ui.form.steps||[]).forEach((st,k)=>{const e=document.getElementById('st_'+k);if(e)st.label=e.value})}
function stepAdd(label){syncInputs();ui.form.steps.push({id:uid(),label,sessions:1,done:0});renderSheet();if(!label)setTimeout(()=>{const e=document.getElementById('st_'+(ui.form.steps.length-1));if(e)e.focus()},50)}
function stepUndo(k){if(!window.confirm('Remettre cette étape à faire ? Elle ne sera plus marquée comme faite.'))return;syncInputs();const st=ui.form.steps[k];if(st)st.done=0;renderSheet()}
function stepBump(k,n){syncInputs();const st=ui.form.steps[k];st.sessions=Math.max(Math.max(1,st.done),Math.min(10,st.sessions+n));renderSheet()}
function stepMove(k,n){syncInputs();const a=ui.form.steps;[a[k],a[k+n]]=[a[k+n],a[k]];renderSheet()}
function stepDel(k){syncInputs();ui.form.steps.splice(k,1);renderSheet()}
function computePlanExcluding(id){if(!id)return computePlan();const keep=S.items;S.items=S.items.filter(i=>i.id!==id);const P=computePlan();S.items=keep;return P}
function syncInputs(){syncSteps_();const t=document.getElementById('fTitle');if(t)ui.form.title=t.value;const n=document.getElementById('fNotes');if(n)ui.form.notes=n.value}
function setF(k,v){syncInputs();ui.form[k]=v;if(k==='type'&&!ui.form.custom){ui.form.sessions=TYPES[v].sizes[Math.max(0,ui.form.size)]}renderSheet()}
function setSize(k){syncInputs();const f=ui.form;if(k<0){f.custom=true}else{f.custom=false;f.size=k;f.sessions=TYPES[f.type].sizes[k]}renderSheet()}
function bump(n){syncInputs();ui.form.sessions=Math.max(1,Math.min(20,ui.form.sessions+n));renderSheet()}
function saveForm(){
  syncInputs();const f=ui.form;
  if(!f.title.trim()){const e=document.getElementById('fTitle');e.placeholder='Écris un nom pour ce travail';e.style.borderColor='var(--bad)';e.focus();return}
  if(!f.due)return;
  const steps=f.steps.map((st,k)=>Object.assign({},st,{label:(st.label||'').trim()||('Étape '+(k+1))}));
  if(f.id){const i=itemById(f.id);const changedEst=i.done===0;
    if(steps.length){if(!hasSteps(i)&&i.done){steps[0].done=Math.min(i.done,steps[0].sessions)}i.steps=steps}else{if(hasSteps(i))i.done=i.steps.reduce((a,x)=>a+x.done,0);delete i.steps}
    Object.assign(i,{title:f.title.trim(),subject:f.subject,type:f.type,due:f.due,notes:f.notes});
    if(hasSteps(i))syncSteps(i);else i.sessions=Math.max(f.sessions,i.done||0,1);
    if(changedEst)i.est0=i.sessions;
    if(i.done>=i.sessions&&!i.completed)completeItem(i);
  }else{
    const ni={id:uid(),title:f.title.trim(),subject:f.subject,type:f.type,due:f.due,sessions:f.sessions,done:0,log:[],slog:[],notes:f.notes,completed:false,created:today()};
    if(steps.length){ni.steps=steps;syncSteps(ni)}ni.est0=ni.sessions;S.items.push(ni);
  }
  commit();ui.sheet=null;ui.form=null;
  if(!f.id){ui.selDay=f.due;}
  render();
}
function deleteItem(id){S.items=S.items.filter(i=>i.id!==id);commit();closeSheet()}
function completeItem(i){i.completed=true;i.completedAt=today();S.history.push({id:i.id,subject:i.subject,type:i.type,est:i.est0||i.sessions,actual:Math.max(1,i.done)});if(S.history.length>200)S.history=S.history.slice(-200)}
function uncomplete(i){i.completed=false;S.history=S.history.filter(x=>x.id!==i.id)}
function finishItem(id){const i=itemById(id);completeItem(i);if(hasSteps(i))i.steps.forEach(z=>{z.sessions=Math.max(1,z.done);});commit();closeSheet();confetti(true)}
function reopen(id){const i=itemById(id);uncomplete(i);if(i.done>=i.sessions){if(hasSteps(i)){i.steps[i.steps.length-1].sessions++;syncSteps(i)}else i.sessions=i.done+1}commit();closeSheet()}

/* session done */
function doSession(id,sid){const i=itemById(id);const lv=levelInfo().n;
  i.log=i.log||[];i.slog=i.slog||[];while(i.slog.length<i.log.length)i.slog.push(null);
  let st=null;if(hasSteps(i)){st=i.steps.find(z=>z.id===sid)||i.steps.find(z=>z.done<z.sessions);if(st)st.done++;syncSteps(i)}else i.done++;
  i.log.push(today());i.slog.push(st?st.id:null);
  const stepDone=st&&st.done>=st.sessions;
  if(i.done>=i.sessions){completeItem(i)}
  commit();ui.sheet={kind:'after',id,step:st?st.id:null,stepDone,cheer:cheer()};render();confetti(i.completed||stepDone)}
function undoSession(id){const i=itemById(id);const k=(i.log||[]).lastIndexOf(today());if(k<0)return;
  const sid=(i.slog||[])[k];i.log.splice(k,1);if(i.slog)i.slog.splice(k,1);
  if(hasSteps(i)){const st=i.steps.find(z=>z.id===sid)||i.steps.slice().reverse().find(z=>z.done>0);if(st)st.done=Math.max(0,st.done-1);syncSteps(i)}else i.done=Math.max(0,i.done-1);
  if(i.completed&&i.done<i.sessions){uncomplete(i)}commit();render()}
function afterHtml(){const i=itemById(ui.sheet.id);if(!i)return'';const rem=i.sessions-i.done;
  const lu='';
  if(i.completed)return `<h2>🎉 « ${h(i.title)} » est terminé !</h2>${lu}<div class="sub">${i.done} séance${i.done>1?'s':''} au total.</div>
    <div class="btnrow"><button class="btn ghost" onclick="needMore('${i.id}')">En fait, il m'en faut encore une</button><button class="btn" onclick="closeSheet()">Super</button></div>`;
  const sst=ui.sheet.step&&hasSteps(i)?i.steps.find(z=>z.id===ui.sheet.step):null;
  const stepMsg=sst&&ui.sheet.stepDone?`<div class="hint"><span style="color:var(--ok);display:inline-flex;vertical-align:middle;margin-right:4px">${MS('check_circle')}</span>Étape « ${h(sst.label)} » terminée ! Encore ${i.steps.filter(z=>z.done<z.sessions).length} étape${i.steps.filter(z=>z.done<z.sessions).length>1?'s':''}.</div>`:'';
  return `<h2>${h(ui.sheet.cheer||'Bien joué !')}</h2>${lu}${stepMsg}<div class="sub">C'était comment ?</div>
   <div class="stack"><button class="btn" onclick="closeSheet()">Ça a pris le temps prévu</button>
   <button class="btn ghost" onclick="finishItem('${i.id}')">Ça m'a pris moins de temps</button>
   <button class="btn ghost" onclick="needMore('${i.id}','${ui.sheet.step||''}')">Ça a pris plus de temps que prévu</button></div>`}
function needMore(id,sid){const i=itemById(id);if(i.completed)uncomplete(i);if(hasSteps(i)){const st=i.steps.find(z=>z.id===sid)||i.steps[i.steps.length-1];st.sessions++;syncSteps(i)}else i.sessions++;commit();closeSheet()}

/* calendar + settings actions */
function calStartDay(){if(!ui.calStart){const t=today();ui.calStart=addDays(t,-((parse(t).getDay()+6)%7))}return ui.calStart}
function moveMonth(n){ui.calStart=addDays(calStartDay(),28*n);render()}
function selDay(d){ui.selDay=d;render()}
function setOverride(d,v){if(v==null)delete S.dayOverride[d];else S.dayOverride[d]=v;
  const t=today();Object.keys(S.dayOverride).forEach(k=>{if(k<addDays(t,-60))delete S.dayOverride[k]});commit();render()}
function setTheme(k){S.settings.theme=k;applyTheme();commit();render()}
function setStop(w,v){S.settings.stop=S.settings.stop||{};const k=String(w);if(!v)delete S.settings.stop[k];else S.settings.stop[k]={at:v,why:(S.settings.stop[k]||{}).why||(w===0?'Routine du dimanche soir':'')};commit();render()}
function setPace(v){S.settings.pace=v;commit();render()}
function setSession(v){S.settings.sessionMin=v;commit();render()}
function setCap(w,n){S.settings.cap[w]=Math.max(0,Math.min(240,S.settings.cap[w]+n));commit();render()}
function addSubject(e){e.preventDefault();const v=(document.getElementById('newSubj').value||'').trim();if(v&&!S.settings.subjects.includes(v)){S.settings.subjects.push(v);commit()}ui.newSubject='';render()}
function delSubject(k){S.settings.subjects.splice(k,1);commit();render()}
function resetAll(){const st=S.settings;S=defaultState();S.settings=st;ui.confirmReset=false;commit();render()}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet()});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['today','calendar','list','settings'].includes(v)&&v!==ui.view){ui.view=v;render()}});
if(FIREBASE_CONFIG){ui.auth={step:'done'};}
render();
if(FIREBASE_CONFIG)initFirebase();else initDb();
</script>
</body>
